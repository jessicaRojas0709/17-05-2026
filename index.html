<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Semanal · Mercadona · 1350 kcal</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F0D;--surface:#111713;--card:#161D19;--card2:#1C2620;
  --green:#22C55E;--green-dim:#14532D;--green-light:#86EFAC;
  --lime:#A3E635;--orange:#FB923C;--blue:#60A5FA;--purple:#C084FC;
  --gold:#FDE68A;--gold-dim:#78350F;--red:#F87171;
  --text:#F0FDF4;--muted:#6B7280;--border:#1F2D23;
  --merc:#009B77;/* Mercadona green */
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);min-height:100vh;}

.nav{position:sticky;top:0;z-index:100;background:rgba(10,15,13,0.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;overflow-x:auto;gap:0;}
.nav-brand{font-family:'Syne',serif;font-size:12px;font-weight:800;color:var(--green);padding:13px 16px 13px 0;border-right:1px solid var(--border);margin-right:14px;white-space:nowrap;flex-shrink:0;letter-spacing:2px;text-transform:uppercase;}
.tab{padding:13px 15px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.18s;white-space:nowrap;flex-shrink:0;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--green);border-bottom-color:var(--green);}
.tab.gym{color:#C084FC;}
.tab.walk{color:#60A5FA;}
.tab.rest{color:#6B7280;}

.panel{display:none;max-width:940px;margin:0 auto;padding:26px 18px 60px;}
.panel.active{display:block;}

/* TOP ROW */
.top-pills{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.pill{padding:5px 12px;border-radius:16px;font-size:10px;font-weight:600;letter-spacing:0.8px;text-transform:uppercase;}
.p-gym{background:rgba(192,132,252,0.12);color:var(--purple);border:1px solid rgba(192,132,252,0.25);}
.p-walk{background:rgba(96,165,250,0.12);color:var(--blue);border:1px solid rgba(96,165,250,0.25);}
.p-rest{background:rgba(107,114,128,0.12);color:var(--muted);border:1px solid rgba(107,114,128,0.2);}
.p-kcal{background:rgba(253,230,138,0.1);color:var(--gold);border:1px solid rgba(253,230,138,0.2);}
.p-merc{background:rgba(0,155,119,0.12);color:var(--merc);border:1px solid rgba(0,155,119,0.25);}

/* DAY HEADER */
.day-hd{margin-bottom:18px;}
.day-title{font-family:'Syne',sans-serif;font-size:clamp(22px,4vw,34px);font-weight:800;line-height:1.1;}
.day-title span{color:var(--green);}
.day-sub{font-size:12px;color:var(--muted);margin-top:4px;}

/* GRID */
.day-grid{display:grid;grid-template-columns:1fr 360px;gap:16px;}
@media(max-width:700px){.day-grid{grid-template-columns:1fr;}}

/* KCAL STRIP */
.kcal-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;}
.ks{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;}
.ks-num{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;display:block;transition:color 0.3s;}
.ks-lbl{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:2px;}

/* TRACKER */
.tbar{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.tbar-top{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:6px;}
.tbar-track{height:8px;background:var(--border);border-radius:4px;overflow:hidden;display:flex;}
.tseg{height:100%;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);}
.tbar-leg{display:flex;gap:10px;margin-top:7px;flex-wrap:wrap;}
.tleg{font-size:10px;display:flex;align-items:center;gap:4px;color:var(--muted);transition:all 0.2s;}
.tleg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.live-bar{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 14px;font-size:11px;color:var(--muted);display:flex;gap:8px;margin-bottom:14px;}

/* MEAL CARD */
.mc{background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:10px;overflow:hidden;transition:box-shadow 0.18s;}
.mc:hover{box-shadow:0 4px 20px rgba(0,0,0,0.4);}
.mc-top{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;border-bottom:1px solid transparent;transition:border-color 0.18s;}
.mc.open .mc-top{border-bottom-color:var(--border);}
.mc-emoji{font-size:22px;flex-shrink:0;}
.mc-meta{flex:1;}
.mc-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;}
.mc-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.mc-kcal{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--green);flex-shrink:0;}
.mc-kcal small{font-size:9px;color:var(--muted);font-family:'Inter';font-weight:400;}
.chev{color:var(--muted);font-size:10px;margin-left:5px;transition:transform 0.18s;flex-shrink:0;}
.mc.open .chev{transform:rotate(180deg);}
.mc-chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;font-size:11px;transition:all 0.18s;color:var(--muted);margin-left:4px;}
.mc-chk:hover{border-color:var(--green);}
.mc.ticked .mc-chk{background:var(--green-dim);border-color:var(--green);color:var(--green-light);}
.mc.ticked .mc-name{text-decoration:line-through;opacity:0.45;}
.mc.ticked{opacity:0.65;}
.mc-body{display:none;padding:13px 15px 15px;}
.mc.open .mc-body{display:block;}
.merc-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(0,155,119,0.1);color:var(--merc);font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:5px;margin-bottom:9px;border:1px solid rgba(0,155,119,0.2);}
.ing{list-style:none;margin-bottom:11px;}
.ing li{display:flex;justify-content:space-between;font-size:11px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.ing li:last-child{border-bottom:none;}
.ing li span{color:var(--green);font-size:10px;font-weight:600;}
.ing li em{color:var(--merc);font-size:9px;font-style:normal;margin-left:4px;}
.steps-box{background:rgba(255,255,255,0.02);border-radius:8px;padding:10px 12px;}
.steps-box h4{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:7px;font-weight:600;}
.step{display:flex;gap:7px;margin-bottom:5px;font-size:11px;color:var(--muted);line-height:1.5;}
.step:last-child{margin-bottom:0;}
.sn{background:var(--green-dim);color:var(--green-light);width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0;margin-top:1px;}
.tip{margin-top:8px;background:rgba(34,197,94,0.06);border-left:2px solid var(--green-dim);padding:6px 10px;font-size:10px;color:var(--green-light);border-radius:0 5px 5px 0;}

/* RIGHT COLUMN */
.right-col{display:flex;flex-direction:column;gap:12px;}
.act-card{background:var(--card);border:1px solid var(--border);border-radius:13px;overflow:hidden;}
.act-hd{padding:12px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px;}
.act-icon{font-size:20px;flex-shrink:0;}
.act-title-wrap{flex:1;}
.act-title{font-family:'Syne',sans-serif;font-size:13px;font-weight:700;}
.act-sub{font-size:10px;color:var(--muted);margin-top:1px;}
.act-burn{font-family:'Syne',sans-serif;font-size:14px;font-weight:800;color:var(--red);}
.act-burn small{font-size:9px;color:var(--muted);font-family:'Inter';font-weight:400;}
.act-body{padding:12px 15px;}
.act-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--purple);font-weight:600;margin-bottom:7px;}
.ex-list{list-style:none;}
.ex-list li{font-size:11px;color:var(--muted);padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;justify-content:space-between;gap:8px;}
.ex-list li:last-child{border-bottom:none;}
.ex-list li span{color:var(--text);font-size:10px;white-space:nowrap;}
.walk-box{background:rgba(96,165,250,0.07);border-radius:9px;padding:10px 13px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}
.walk-num{font-family:'Syne',sans-serif;font-size:32px;font-weight:800;color:var(--blue);line-height:1;}
.walk-info{font-size:11px;color:var(--muted);line-height:1.6;}
.walk-info strong{color:var(--text);display:block;font-size:12px;}
.yoga-box{background:rgba(34,197,94,0.06);border-radius:9px;padding:10px 13px;}
.yoga-name{font-size:12px;font-weight:600;color:var(--green);margin-bottom:3px;}
.yoga-desc{font-size:11px;color:var(--muted);line-height:1.5;}
.deficit-box{background:linear-gradient(135deg,rgba(34,197,94,0.08),rgba(192,132,252,0.08));border:1px solid rgba(34,197,94,0.15);border-radius:10px;padding:12px 14px;}
.db-title{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:8px;font-weight:600;}
.db-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;color:var(--muted);}
.db-row span:last-child{font-weight:600;color:var(--text);}
.db-total{border-top:1px solid rgba(255,255,255,0.08);margin-top:7px;padding-top:7px;display:flex;justify-content:space-between;font-size:12px;font-weight:700;}
.rest-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:20px;text-align:center;}
.rest-icon{font-size:40px;margin-bottom:10px;}
.rest-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;margin-bottom:6px;}
.rest-text{font-size:12px;color:var(--muted);line-height:1.7;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-brand">🛒 Mercadona</div>
  <div class="tab active gym" onclick="showTab('lun',this)">💪 Lun</div>
  <div class="tab gym" onclick="showTab('mar',this)">💪 Mar</div>
  <div class="tab walk" onclick="showTab('mie',this)">🚶 Mié</div>
  <div class="tab gym" onclick="showTab('jue',this)">💪 Jue</div>
  <div class="tab gym" onclick="showTab('vie',this)">💪 Vie</div>
  <div class="tab walk" onclick="showTab('sab',this)">🚶 Sáb</div>
  <div class="tab rest" onclick="showTab('dom',this)">😴 Dom</div>
</nav>

<div id="app"></div>

<script>
const GOAL=1350,TMB=1574;
const ST={};
const SC={des:'#F87171',com:'#FDE68A',snk:'#60A5FA',cen:'#22C55E'};
const KS=['des','com','snk','cen'];

const DK={
  lun:{des:340,com:470,snk:185,cen:360},
  mar:{des:350,com:460,snk:185,cen:360},
  mie:{des:340,com:470,snk:185,cen:360},
  jue:{des:350,com:460,snk:185,cen:360},
  vie:{des:340,com:470,snk:185,cen:360},
  sab:{des:350,com:460,snk:185,cen:360},
  dom:{des:350,com:460,snk:185,cen:360},
};

function showTab(id,el){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  el.classList.add('active');
}
function tog(el){el.classList.toggle('open');}

function tick(e,day,mk){
  e.stopPropagation();
  if(!ST[day])ST[day]={};
  ST[day][mk]=!ST[day][mk];
  const card=document.getElementById(day+'-c-'+mk);
  const chk=document.getElementById(day+'-k-'+mk);
  if(ST[day][mk]){card.classList.add('ticked');chk.style.transform='scale(1.3)';setTimeout(()=>chk.style.transform='scale(1)',180);}
  else card.classList.remove('ticked');
  upBar(day);
}

function upBar(day){
  const s=ST[day]||{},k=DK[day];
  let tot=0;KS.forEach(mk=>{if(s[mk])tot+=k[mk];});
  const pct=Math.min(100,Math.round(tot/GOAL*100)),over=tot>GOAL;
  KS.forEach(mk=>{
    const sg=document.getElementById(day+'-s-'+mk),lg=document.getElementById(day+'-l-'+mk);
    if(sg)sg.style.width=s[mk]?Math.round(k[mk]/GOAL*100)+'%':'0%';
    if(lg){lg.style.opacity=s[mk]?'1':'0.35';lg.style.fontWeight=s[mk]?'600':'400';}
  });
  const pe=document.getElementById(day+'-pct');if(pe)pe.textContent=pct+'%';
  const be=document.getElementById(day+'-big');if(be){be.textContent=tot;be.style.color=over?'var(--red)':'var(--text)';}
  const le=document.getElementById(day+'-left');if(le)le.textContent=over?'+'+(tot-GOAL)+' sobre meta':GOAL-tot+'';
  const te=document.getElementById(day+'-txt');
  if(te){
    const done=KS.every(mk=>s[mk]);const col=over?'var(--red)':'var(--green)';
    if(tot===0)te.innerHTML='Toca ✓ al terminar cada comida';
    else if(done)te.innerHTML='🎉 Día completado — <strong style="color:'+col+'">'+tot+' kcal</strong> · '+(over?'⚠️ Sobre meta':'✓ En déficit');
    else te.innerHTML='Consumido: <strong style="color:'+col+'">'+tot+' kcal</strong> · quedan '+(GOAL-tot)+' kcal';
  }
}

function C(day,mk,em,name,sub,kcal,ings,steps,tip){
  const iH=ings.map(([f,k,m])=>'<li>'+f+(m?'<em>🛒 '+m+'</em>':'')+'<span>'+k+'</span></li>').join('');
  const sH=steps.map((s,i)=>'<div class="step"><div class="sn">'+(i+1)+'</div><span>'+s+'</span></div>').join('');
  const tH=tip?'<div class="tip">💡 '+tip+'</div>':'';
  return '<div class="mc" id="'+day+'-c-'+mk+'" onclick="tog(this)"><div class="mc-top"><div class="mc-emoji">'+em+'</div><div class="mc-meta"><div class="mc-name">'+name+'</div><div class="mc-sub">'+sub+'</div></div><div class="mc-kcal">~'+kcal+'<small> kcal</small></div><div class="chev">▼</div><div class="mc-chk" id="'+day+'-k-'+mk+'" onclick="tick(event,\''+day+'\',\''+mk+'\')">✓</div></div><div class="mc-body"><div class="merc-badge">🛒 Disponible en Mercadona</div><ul class="ing">'+iH+'</ul><div class="steps-box"><h4>Preparación</h4>'+sH+'</div>'+tH+'</div></div>';
}

function bar(day,k){
  const segs=KS.map(mk=>'<div class="tseg" id="'+day+'-s-'+mk+'" style="width:0%;background:'+SC[mk]+'"></div>').join('');
  const legs=KS.map((mk,i)=>{const lb=['Des ~'+k.des,'Com ~'+k.com,'Snk ~'+k.snk,'Cen ~'+k.cen];return'<div class="tleg" id="'+day+'-l-'+mk+'" style="opacity:0.35"><div class="tleg-dot" style="background:'+SC[mk]+'"></div>'+lb[i]+'</div>';}).join('');
  return '<div class="tbar"><div class="tbar-top"><span id="'+day+'-pct">0%</span><span>meta 1,350 kcal</span></div><div class="tbar-track">'+segs+'</div><div class="tbar-leg">'+legs+'</div></div>';
}

function kstrip(day,k,burn){
  const net=TMB+burn-k.des-k.com-k.snk-k.cen;
  return '<div class="kcal-strip"><div class="ks"><span class="ks-num" id="'+day+'-big" style="color:var(--green)">0</span><div class="ks-lbl">ingeridas</div></div><div class="ks"><span class="ks-num" style="color:var(--red)">~'+burn+'</span><div class="ks-lbl">quemadas</div></div><div class="ks"><span class="ks-num" style="color:var(--lime)">~'+net+'</span><div class="ks-lbl">déficit neto</div></div><div class="ks"><span class="ks-num" id="'+day+'-left" style="color:var(--gold)">'+GOAL+'</span><div class="ks-lbl">disponibles</div></div></div>';
}

function snk(day){
  return C(day,'snk','💪','Snack · Proteína vegetal','~17:00h',185,
    [['Whey protein vegetal (1 scoop)','120 kcal','tu marca habitual'],['Leche de soya sin azúcar (250ml)','65 kcal','Hacendado soya']],
    ['Shaker con hielo. 30 segundos.'],null);
}

function gym(day,muscles,exs,burn){
  const eH=exs.map(([n,s,t])=>'<li>'+n+(t?'<br><span style="color:var(--muted);font-size:9px">→ '+t+'</span>':'')+'<span>'+s+'</span></li>').join('');
  return '<div class="act-card"><div class="act-hd"><div class="act-icon">🏋️</div><div class="act-title-wrap"><div class="act-title">Gym · '+muscles+'</div><div class="act-sub">~60–75 min</div></div><div class="act-burn">~'+burn+'<small> kcal</small></div></div><div class="act-body"><div class="act-label">Ejercicios</div><ul class="ex-list">'+eH+'</ul></div></div>';
}

function walk(burn){
  return '<div class="act-card"><div class="act-hd"><div class="act-icon">🚶</div><div class="act-title-wrap"><div class="act-title">Caminata · 10,000 pasos</div><div class="act-sub">~80–90 min · ritmo moderado</div></div><div class="act-burn">~'+burn+'<small> kcal</small></div></div><div class="act-body"><div class="walk-box"><div class="walk-num">10k</div><div class="walk-info"><strong>~7–8 km · ~80 min</strong>Ritmo 5.5 km/h · zona quema grasa</div></div><ul class="ex-list"><li>Primeros 10 min<span>Calentamiento suave</span></li><li>60 min<span>Ritmo sostenido constante</span></li><li>Últimos 10 min<span>Enfriamiento</span></li></ul></div></div>';
}

function yoga(style,dur,desc){
  return '<div class="act-card"><div class="act-hd"><div class="act-icon">🧘</div><div class="act-title-wrap"><div class="act-title">Yoga en casa · '+style+'</div><div class="act-sub">~'+dur+' min</div></div><div class="act-burn">~60<small> kcal</small></div></div><div class="act-body"><div class="yoga-box"><div class="yoga-name">'+style+'</div><div class="yoga-desc">'+desc+'</div></div></div></div>';
}

function deficit(day,burn,tipo){
  const k=DK[day],tot=k.des+k.com+k.snk+k.cen,net=TMB+burn-tot;
  return '<div class="deficit-box"><div class="db-title">💥 Déficit estimado del día</div><div class="db-row"><span>Kcal ingeridas</span><span style="color:var(--red)">~'+tot+' kcal</span></div><div class="db-row"><span>TMB + '+tipo+'</span><span style="color:var(--green)">~'+(TMB+burn)+' kcal</span></div><div class="db-total"><span>Déficit neto</span><span style="color:var(--lime)">~'+net+' kcal</span></div></div>';
}

// ─── DATA ────────────────────────────────────────────────
const DATA={

lun:{label:'Lunes',date:'💪 Gym · Espalda + Bíceps + Core',type:'gym',burn:370,
  des:['🍳','Tostada con huevo y aguacate','7:30h',340,
    [['Pan integral (2 rebanadas)','140 kcal','Bimbo integral o similar'],['Huevo a la plancha (1 pza)','75 kcal',null],['Aguacate (¼ pza)','80 kcal',null],['Fruta: naranja o kiwi','60 kcal',null]],
    ['Tuesta el pan. Aplasta el aguacate con sal y limón.','Huevo a la plancha en sartén con spray. Pan + aguacate + huevo.','Fruta al lado.'],
    'Pre-gym: carbohidratos + proteína = energía sostenida para el entreno.'],
  com:['🍗','Pechuga de pollo con arroz y calabacín','13:30h',470,
    [['Pechuga de pollo (150g)','165 kcal','Hacendado fresca o congelada'],['Arroz blanco o basmati (85g seco)','300 kcal','Arroz Hacendado — guarda ½ para mañana'],['Calabacín (150g)','25 kcal',null],['Aceite oliva virgen (½ cdita)','20 kcal','Hacendado AOVE']],
    ['Cuece el arroz (20 min). Guarda la mitad en tupper.','Pollo a la plancha con limón y orégano, 5 min/lado.','Calabacín al vapor 8 min o en sartén.'],
    'Guarda el arroz sobrante: te ahorras cocinar mañana.'],
  cen:['🐟','Salmón al horno con boniato y espinacas','20:30h',360,
    [['Salmón fresco o congelado (130g)','175 kcal','Hacendado lomo salmón'],['Boniato (130g)','113 kcal',null],['Espinacas baby (bolsa)','20 kcal','Hacendado bolsa lavada'],['Aceite oliva (½ cdita)','20 kcal',null]],
    ['Horno 190°C: boniato en dados 25 min, salmón los últimos 15 con limón.','Espinacas salteadas 2 min con ajo.'],
    'Omega-3 del salmón reduce inflamación muscular post-entreno.'],
  right:()=>gym('lun','Espalda + Bíceps + Core',[
    ['Dominadas asistidas (banda)','4×6–8','Reduce asistencia ½ kg vs semana pasada'],
    ['Remo con mancuerna','4×10','Espalda plana, codo cerca del cuerpo'],
    ['Jalón al pecho agarre supino','3×12','Activa más el bíceps'],
    ['Curl de bíceps mancuernas','3×12–15','Sin balanceo, movimiento limpio'],
    ['Ab wheel rollout','3×8–10','Sal solo hasta donde controlas la vuelta'],

// BUILD ALL PANELS
const app=document.getElementById('app');
Object.entries(DATA).forEach(([id,d])=>{
  const k=DK[id];
  const typeMap={gym:'<span class="pill p-gym">💪 Gym</span>',walk:'<span class="pill p-walk">🚶 10k Pasos</span><span class="pill p-yoga">🧘 Yoga</span>',rest:'<span class="pill p-rest">😴 Descanso</span>'};
  const pills='<div class="top-pills"><span class="pill p-merc">🛒 Mercadona</span>'+(typeMap[d.type]||'')+'<span class="pill p-kcal">🎯 1,350 kcal</span></div>';
  const hdr='<div class="day-hd"><div class="day-title">'+d.label+'<br><span style="font-size:clamp(13px,2vw,16px);font-weight:600;color:var(--muted)">'+d.date+'</span></div></div>';
  const food='<div class="col-food">'+kstrip(id,k,d.burn)+bar(id,k)+C(id,'des',...d.des)+C(id,'com',...d.com)+snk(id)+C(id,'cen',...d.cen)+'<div class="live-bar"><span>🎯</span><span id="'+id+'-txt">Toca ✓ al terminar cada comida</span></div></div>';
  const right='<div class="right-col">'+d.right()+'</div>';
  const panel=document.createElement('div');
  panel.className='panel'+(id==='lun'?' active':'');
  panel.id='tab-'+id;
  panel.innerHTML=pills+hdr+'<div class="day-grid">'+food+right+'</div>';
  app.appendChild(panel);
});
